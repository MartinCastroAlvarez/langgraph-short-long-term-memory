[tool.poetry]
name = "langgraph-short-long-term-memory"
version = "0.1.0"
description = "Agent memory in LangGraph, short-term vs long-term: a personal assistant whose thread history lives in a SQLite checkpointer (token-budget trimming, running summaries, per-thread isolation, time travel) and whose per-user facts, episodes and self-updated instructions live in a semantic store (hot-path tools and a background consolidation job, update instead of duplicate, forget-me). Runs 100% locally on ollama."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/langgraph-short-long-term-memory"
repository = "https://github.com/MartinCastroAlvarez/langgraph-short-long-term-memory"
documentation = "https://github.com/MartinCastroAlvarez/langgraph-short-long-term-memory#readme"
keywords = [
    "langgraph",
    "langchain",
    "ai-agents",
    "agent-memory",
    "long-term-memory",
    "checkpointer",
    "semantic-search",
    "summarization",
    "langmem",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "memory_agent" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
memory-agent = "memory_agent.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
langgraph = ">=1.2.17,<2"
langgraph-checkpoint-sqlite = ">=3.1.2,<4"
langchain-core = ">=1.7,<2"
langchain-ollama = ">=1.1,<2"
pydantic = ">=2.10,<3"
numpy = ">=2.1,<3"
langchain-anthropic = { version = ">=1.7,<2", optional = true }
fastembed = { version = ">=0.9,<1", optional = true }

[tool.poetry.extras]
anthropic = ["langchain-anthropic"]
fastembed = ["fastembed"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "E501"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["memory_agent", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=memory_agent",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "s3_agent_memory", "s3_agent_memory.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["memory_agent"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = ["memory_agent/__main__.py"]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
